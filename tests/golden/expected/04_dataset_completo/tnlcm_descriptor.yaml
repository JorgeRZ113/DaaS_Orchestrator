trial_network:
  tn_init:
    type: "tn_init"
    dependencies: []
    input: {}
  monitoring-test:
    type: "monitoring"
    name: "test"
    dependencies:
    - "tn_init"
    input:
      one_influxdb_version: "2.7.11"
      one_influxdb_user: "admin"
      one_influxdb_password: "adminadmin"
      one_influxdb_org: "testing"
      one_influxdb_bucket: "testing"
      one_influxdb_token: "default-token-testing"
      one_grafana_version: "11.6.0"
      one_grafana_password: "adminadmin"
      one_prometheus_version: "2.54.3"
  elcm-exp:
    type: "elcm"
    name: "exp"
    dependencies:
    - "monitoring-test"
    input:
      one_elcm_influxdb: "monitoring-test"
      one_elcm_grafana: "monitoring-test"
  vnet-n2:
    type: "vnet"
    name: "n2"
    dependencies:
    - "tn_init"
    input:
      one_vnet_first_ip: "10.10.10.1"
      one_vnet_netmask: 24
      one_vnet_address_size: 100
  open5gs_vm-core:
    type: "open5gs_vm"
    name: "core"
    dependencies:
    - "vnet-n2"
    input:
      one_open5gs_vm_external_vnet: "tn_vxlan"
      one_open5gs_vm_internal_vnet:
      - "vnet-n2"
      one_open5gs_vm_size: "small"
      one_open5gs_vm_ue_subnet: "10.45.0.0/16"
      one_open5gs_vm_amf_n2_ip: "10.10.10.200"
      one_open5gs_vm_upf_n3_ip: "10.10.10.201"
      one_open5gs_vm_ue_count: 20
      one_open5gs_vm_tac: 200
      one_open5gs_vm_mcc: "001"
      one_open5gs_vm_mnc: "01"
      one_open5gs_vm_msin: "0000000001"
      one_open5gs_vm_key: ""
      one_open5gs_vm_opc: ""
      one_open5gs_vm_apn: "internet"
      one_open5gs_vm_s_nssai_sst: 1
      one_open5gs_vm_s_nssai_sd: "000009"
  ueransim-both:
    type: "ueransim"
    name: "both"
    dependencies:
    - "open5gs_vm-core"
    input:
      one_ueransim_networks:
      - "tn_vxlan"
      one_ueransim_mode: "both"
      one_ueransim_gnb_linked_5gcore: "open5gs_vm-core"
