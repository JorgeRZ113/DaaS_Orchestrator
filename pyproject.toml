[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daas-orchestrator"
version = "0.1.0"
description = "MVP de capa de orquestación DaaS para 6G-SANDBOX"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Jorge Ramirez Zotano", email = "jorgeramirezzotano@uma.es" },
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pyyaml",
    "python-dotenv",
    "httpx",
]

[project.optional-dependencies]
# Versiones fijadas del linter/formatter: garantizan que CI y local apliquen
# EXACTAMENTE las mismas reglas. Sin fijar, el CI instalaba la última ruff
# (0.16.x amplió el set de reglas por defecto) y rompía el job de lint con
# código que localmente pasaba. Ver también la versión fijada de ytt en CLAUDE.md §5.
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff==0.15.20",
    "black==26.5.1",
]
# UI web opcional (Streamlit). No forma parte del runtime del servicio: se
# instala aparte con `pip install -e ".[ui]"` para no inflar la imagen del core.
ui = [
    "streamlit",
]

[project.scripts]
daas-orchestrator = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
target-version = ["py311"]


[tool.hatch.build.targets.wheel]
packages = ["app"]
