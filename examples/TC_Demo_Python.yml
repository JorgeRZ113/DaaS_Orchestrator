# =============================================================================
# Banda de Order: 140-159. Prerrequisitos: NINGUNO (los datos son sinteticos).
# Duracion: inmediata.
#
#   - Un valor de texto HAY QUE entrecomillarlo en la expresion:
#     '@[Samples]' con comillas, si no eval() lo tomaria por un identificador y
#     lanzaria NameError.
#   - Si eval() lanza una excepcion, la task la propaga y ABORTA la ejecucion
#     entera. Las expresiones tienen que ser deterministas.
# =============================================================================
Version: 2
Name: "TC_Demo_Python"
Sequence:
  # --- Semilla: muestras de latencia sinteticas, para que el TestCase sea
  # autocontenido. El umbral sale del UE si existe, y si no del default 20.
  - Order: 140
    Task: "Run.Publish"
    Config:
      Samples: "12.4, 15.1, 9.8, 22.0, 11.3"
      SlaMs: "@[SlaLatencyMs:20]"


  - Order: 141
    Task: "Run.Evaluate"
    Config:
      Key: "SampleCount"
      Expression: "len('@[Samples]'.split(','))"

  - Order: 142
    Task: "Run.Evaluate"
    Config:
      Key: "SampleAvg"
      Expression: "round(sum([float(x) for x in '@[Samples]'.split(',')]) / @[SampleCount], 2)"

  - Order: 143
    Task: "Run.Evaluate"
    Config:
      Key: "SampleMax"
      Expression: "max([float(x) for x in '@[Samples]'.split(',')])"

  - Order: 144
    Task: "Run.Evaluate"
    Config:
      Key: "SamplesOverSla"
      Expression: "len([x for x in '@[Samples]'.split(',') if float(x) > @[SlaMs]])"

  - Order: 145
    Task: "Run.Evaluate"
    Config:
      Key: "SlaCompliancePct"
      Expression: "round(100.0 * (@[SampleCount] - @[SamplesOverSla]) / @[SampleCount], 1)"

  - Order: 146
    Task: "Run.Evaluate"
    Config:
      Key: "SlaVerdict"
      Expression: "'PASS' if @[SlaCompliancePct] >= 95.0 else 'FAIL'"

  - Order: 147
    Task: "Run.Evaluate"
    Config:
      Key: "SlaSummary"
      Expression: "'avg={} ms | max={} ms | fuera de SLA {}/{} muestras | cumplimiento {}%'.format(@[SampleAvg], @[SampleMax], @[SamplesOverSla], @[SampleCount], @[SlaCompliancePct])"

  # --- 8) Acceso a la libreria estandar desde eval() ---
  - Order: 148
    Task: "Run.Evaluate"
    Config:
      Key: "ReportTimestamp"
      Expression: "__import__('time').strftime('%Y-%m-%dT%H:%M:%S')"

  # --- Resultado ---
  - Order: 149
    Task: "Run.Message"
    Config:
      Severity: "INFO"
      Message: "[KPI] @[SlaSummary] -> veredicto @[SlaVerdict] (calculado a las @[ReportTimestamp])"

  - Order: 150
    Task: "Run.Dummy"
    Config:
      Etapa: "KPIs derivados"
      Muestras: "@[Samples]"
      UmbralSlaMs: "@[SlaMs]"
      Media: "@[SampleAvg]"
      Maximo: "@[SampleMax]"
      FueraDeSla: "@[SamplesOverSla]"
      CumplimientoPct: "@[SlaCompliancePct]"
      Veredicto: "@[SlaVerdict]"

Standard: True
Distributed: False
Parameters: {}
Dashboard: {}
KPIs: {}
