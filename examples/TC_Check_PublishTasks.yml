# Banda de Order: 500-519. Prerrequisitos: NINGUNO.
#
# RESULTADO ESPERADO en el log:
#   - "CheckThroughput" = 123.45 y "CheckLatency" = 7.8   (Run.PublishFromFile)
#   - "CheckResultCode" = 0                               (Run.PublishFromPreviousTaskLog)
#   - Veredicto final del TestCase: Pass                  (Run.UpgradeVerdict)
# =============================================================================
Version: 2
Name: "TC_Check_PublishTasks"
Sequence:
  - Order: 500
    Task: "Run.CliExecute"
    Config:
      CWD: "@{TempFolder}"
      Parameters: "sh -c 'F=check_@{ExecutionId}.txt; { echo \"KPI_THROUGHPUT=123.45\"; echo \"KPI_LATENCY=7.8\"; echo \"STATUS=OK\"; } > $F; cat $F'"

  # La linea empieza literalmente por "KPI_THROUGHPUT="
  - Order: 501
    Task: "Run.PublishFromFile"
    Config:
      Path: "@{TempFolder}/check_@{ExecutionId}.txt"
      Pattern: 'KPI_THROUGHPUT=([\d.]+)'
      Keys:
        - [1, "CheckThroughput"]
      VerdictOnMatch: "Pass"
      VerdictOnNoMatch: "Fail"

  - Order: 502
    Task: "Run.PublishFromFile"
    Config:
      Path: "@{TempFolder}/check_@{ExecutionId}.txt"
      Pattern: 'KPI_LATENCY=([\d.]+)'
      Keys:
        - [1, "CheckLatency"]
      VerdictOnMatch: "Pass"
      VerdictOnNoMatch: "Fail"

  - Order: 503
    Task: "Run.Message"
    Config:
      Severity: "INFO"
      Message: "[1/3] PublishFromFile -> CheckThroughput=@[CheckThroughput:NO_PUBLICADO] CheckLatency=@[CheckLatency:NO_PUBLICADO] (esperado 123.45 y 7.8)"

  - Order: 504
    Task: "Run.CliExecute"
    Config:
      CWD: "@{TempFolder}"
      Parameters: "sh -c 'echo RESULT_CODE=0'"

  - Order: 505
    Task: "Run.PublishFromPreviousTaskLog"
    Config:
      Pattern: '.*RESULT_CODE=(\d+).*'
      Keys:
        - [1, "CheckResultCode"]
      VerdictOnMatch: "Pass"
      VerdictOnNoMatch: "Fail"

  - Order: 506
    Task: "Run.Message"
    Config:
      Severity: "INFO"
      Message: "[2/3] PublishFromPreviousTaskLog -> CheckResultCode=@[CheckResultCode:NO_PUBLICADO] (esperado 0)"

  - Order: 507
    Task: "Run.UpgradeVerdict"
    Config:
      Key: "CheckResultCode"
      Pattern: '0$'
      VerdictOnMatch: "Pass"
      VerdictOnNoMatch: "Fail"
      VerdictOnMissing: "Inconclusive"

  # Caso de control: una clave que no existe debe dar el veredicto 'VerdictOnMissing'.
  # Se deja en NotSet para no ensuciar el veredicto global del experimento; en el
  # log debe aparecer "Key 'ClaveQueNoExiste' not found".
  - Order: 508
    Task: "Run.UpgradeVerdict"
    Config:
      Key: "ClaveQueNoExiste"
      VerdictOnMissing: "NotSet"
      VerdictOnMatch: "NotSet"
      VerdictOnNoMatch: "NotSet"

  - Order: 509
    Task: "Run.Message"
    Config:
      Severity: "INFO"
      Message: "[3/3] UpgradeVerdict aplicado. Si el veredicto del TestCase es Pass, las tres tasks funcionan."

  - Order: 510
    Task: "Run.CompressFiles"
    Config:
      Files:
        - "@{TempFolder}/check_@{ExecutionId}.txt"
      Output: "@{TempFolder}/check_publish_@{ExecutionId}.zip"

Standard: True
Distributed: False
Parameters: {}
Dashboard: {}
KPIs: {}
