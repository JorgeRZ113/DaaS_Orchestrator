# REFERENCIA DE COMPONENTES -- campos editables de infrastructure.component
#
# Este fichero NO es un descriptor: es el catalogo de que se puede tocar de cada
# componente a dia de hoy. Sirve para copiar el bloque que interese y pegarlo
# bajo `infrastructure.component` de tu descriptor.
#
# Esta GENERADO a partir de templates/TNLCM/overlays/*.overlay.yaml, que es la
# unica fuente de verdad: el esquema de `component` no es estatico, lo declaran
# los overlays en tiempo de ejecucion. Una prueba comprueba que este fichero
# sigue coincidiendo con ellos, asi que si anades un campo a un overlay y no lo
# reflejas aqui, el pipeline lo avisa.
#
# COMO USARLO
#   * Todos los campos son OPCIONALES salvo los marcados [OBLIGATORIO]. Lo que no
#     indiques se queda con el valor por defecto del overlay.
#   * Para desplegar un componente sin cambiarle nada, basta con nombrarlo y
#     dejarlo vacio:
#
#         component:
#           ueransim_both:
#
#   * Los campos se muestran agrupados por seccion, que es la forma
#     inequivoca. Tambien se admite el formato plano (el campo directamente bajo
#     el componente, sin la seccion), y es el recomendado en el README, pero OJO:
#     en los componentes marcados con [AMBIGUO EN PLANO] hay nombres repetidos en
#     dos secciones y en formato plano solo gana uno.
#
# Generado con: ver tests/integration/test_component_reference.py


