# TestCase de prueba de la integracion con Grafana (dashboard auto-generado).
#
# Cadena de datos: Prometheus (unico componente con visibilidad de Open5GS y,
# via node_exporter, de la VM de UERANSIM) -> Run.PrometheusToInflux -> InfluxDB
# -> paneles Grafana. Al terminar la ejecucion, ELCM crea automaticamente un
# dashboard con uid "Run{ExecutionId}" y rango temporal ajustado al experimento;
# los paneles leen de InfluxDB (datasource por defecto de Grafana) filtrando por
# el tag ExecutionId, NO directamente de Prometheus.
#
# Requisitos: seccion Grafana habilitada en la config del ELCM backend
# (Enabled/Host/Port/Bearer) e InfluxDB como datasource por defecto en Grafana.
#
# Los campos ("Field") de cada panel deben coincidir con la query saneada, por
# eso aqui solo se usan queries simples (el nombre de la metrica tal cual).
Version: 2
Name: "TC_Open5GS_Grafana"
Sequence:
  - Order: 1
    Task: "Flow.Parallel"
    Children:
      - Task: "Run.PrometheusToInflux"
        Config:
          ExecutionId: "@{ExecutionId}"
          Url: "192.168.199.2"
          Port: "9090"
          QueriesRange:
            - "ues_active"
            - "ran_ue"
            - "gnb"
            - "fivegs_ep_n3_gtp_indatapktn3upf"
            - "fivegs_ep_n3_gtp_outdatapktn3upf"
            - "fivegs_upffunction_upf_sessionnbr"
          Measurement: "OPEN5GS_GRAFANA"
          Step: "5s"
          Stop: "stop_prometheus_grafana"
          Account: False
          Encryption: False
      - Task: "Flow.Sequence"
        Children:
          - Task: "Run.Delay"
            Config:
              Time: 180
          - Task: "Run.AddMilestone"
            Config:
              Milestone: "stop_prometheus_grafana"

Standard: True
Distributed: False
Parameters: {}
KPIs: {}
# Rejilla Grafana: 24 columnas de ancho. Size: [alto, ancho], Position: [x, y].
Dashboard:
  - Name: "UEs con sesion PDU activa (SMF)"
    Measurement: "OPEN5GS_GRAFANA"
    Field: "ues_active"
    Type: Graph
    Interval: 5s
    Unit: short
    Size: [8, 12]
    Position: [0, 0]
    Lines: True
    Percentage: False
  - Name: "UEs conectados a la RAN (AMF)"
    Measurement: "OPEN5GS_GRAFANA"
    Field: "ran_ue"
    Type: Graph
    Interval: 5s
    Unit: short
    Size: [8, 12]
    Position: [12, 0]
    Lines: True
    Percentage: False
  - Name: "Paquetes N3 entrada UPF (uplink)"
    Measurement: "OPEN5GS_GRAFANA"
    Field: "fivegs_ep_n3_gtp_indatapktn3upf"
    Type: Graph
    Interval: 5s
    Unit: pps
    Size: [8, 12]
    Position: [0, 8]
    Lines: True
    Percentage: False
  - Name: "Paquetes N3 salida UPF (downlink)"
    Measurement: "OPEN5GS_GRAFANA"
    Field: "fivegs_ep_n3_gtp_outdatapktn3upf"
    Type: Graph
    Interval: 5s
    Unit: pps
    Size: [8, 12]
    Position: [12, 8]
    Lines: True
    Percentage: False
  - Name: "Sesiones activas UPF"
    Measurement: "OPEN5GS_GRAFANA"
    Field: "fivegs_upffunction_upf_sessionnbr"
    Type: Singlestat
    Gauge: True
    Color: ["#299c46", "rgba(237, 129, 40, 0.89)", "#d44a3a"]
    Thresholds: [0, 5, 8, 10]
    Size: [6, 6]
    Position: [0, 16]
  - Name: "gNBs conectados (AMF)"
    Measurement: "OPEN5GS_GRAFANA"
    Field: "gnb"
    Type: Singlestat
    Gauge: False
    Size: [6, 6]
    Position: [6, 16]
