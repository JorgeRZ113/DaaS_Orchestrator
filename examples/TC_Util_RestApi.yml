# =============================================================================
# UTILIDAD: consulta HTTP a una API del despliegue (Run.RestApi)
# =============================================================================
# Proposito: interrogar por HTTP a cualquier servicio del despliegue (health de
# un componente, API de Open5GS/WebUI, exporter, etc.) y dejar publicado el
# codigo de estado para que el experimento pueda decidir sobre el.
#
# Banda de Order: 340-349.
#
# PRERREQUISITOS (el TestCase NO los configura, solo los comprueba):
#   - El servicio HTTP arrancado y escuchando en @[SutIp]:@[SutPort].
#   - Ruta desde el host de ELCM hasta esa IP.
#
# PARAMETROS REALES de Run.RestApi (Executor/Tasks/Run/rest_api.py):
#   Obligatorios: Host, Port, Endpoint
#   Opcionales:   Https (False), Insecure (False), Method (GET), Payload ('{}'),
#                 PayloadMode (None, solo POST: Data|Form), Responses (None),
#                 Timeout (10), Headers (None)
#   NO existen 'URL' ni 'Body': el cliente compone la URL a partir de
#   Host + Port + Endpoint.
#
# SOBRE 'Responses': si se define y el codigo recibido no esta en la lista, la
# task lanza RuntimeError, y una excepcion en una task de PRIMER NIVEL aborta la
# fase Run completa (se pierden los TestCases posteriores del experimento). Aqui
# se deja SIN definir a proposito para que la bateria sea componible; el veredicto
# lo pone Run.UpgradeVerdict sobre el codigo publicado. Para el comportamiento
# fail-fast, descomentar 'Responses: "Success"' (equivale a 200-299).
# =============================================================================
Version: 2
Name: "TC_Util_RestApi"
Sequence:
  - Order: 340
    Task: "Run.RestApi"
    Config:
      Host: "@[SutIp]"
      Port: "@[SutPort:80]"
      Endpoint: "@[SutEndpoint:/]"
      Method: "GET"
      Https: False
      Insecure: False
      Timeout: 10
      # Responses: "Success"

  # Run.RestApi registra el resultado en su log pero no publica nada, asi que el
  # codigo de estado se extrae del log de la task anterior.
  # Linea tipica: "Status '200'; Response: '{...}'"
  - Order: 341
    Task: "Run.PublishFromPreviousTaskLog"
    Config:
      Pattern: ".*Status '(\\d+)';.*"
      Keys:
        - [1, "RestApiStatus"]
      VerdictOnMatch: "NotSet"
      VerdictOnNoMatch: "Fail"

  - Order: 342
    Task: "Run.Message"
    Config:
      Severity: "INFO"
      Message: "[RestApi] GET http://@[SutIp]:@[SutPort:80]@[SutEndpoint:/] -> HTTP @[RestApiStatus:sin_respuesta]"

  # 2xx -> Pass; cualquier otro codigo -> Fail; sin respuesta -> Inconclusive.
  - Order: 343
    Task: "Run.UpgradeVerdict"
    Config:
      Key: "RestApiStatus"
      Pattern: '2\d\d$'
      VerdictOnMatch: "Pass"
      VerdictOnNoMatch: "Fail"
      VerdictOnMissing: "Inconclusive"

Standard: True
Distributed: False
Parameters: {}
Dashboard: {}
KPIs: {}
