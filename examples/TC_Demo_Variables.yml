# =============================================================================
# Variables globales (UE) y expansion de variables
# =============================================================================#
# Banda de Order: 100-109 (TestCases funcionales). Ver mapa en el README.
#
# Prerrequisitos: NINGUNO (no toca infraestructura). Se recomienda lanzarlo con
#   "ues_paths": ["UE_Variables_TEMPLATE.yml"]; sin el UE, las variables se
#   expanden a <<UNDEFINED>>, que es justamente lo que muestra el Order 104.
#
# Las dos sintaxis de expansion de ELCM:
#   @{Nombre}   -> valores FIJOS del motor. Lista completa: TempFolder,
#                  ExecutionId, SliceId, DeployedSliceId, Application,
#                  JSONParameters, ReservationTime, ReservationTimeSeconds,
#                  TapFolder, TapResults, y Iter0/Iter1/Branch dentro de Flows.
#                  No existe @{Params.x}.
#   @[Nombre]   -> valores publicados con Run.Publish. Admite grupo explicito
#                  (@[Publish.x]), parametros del descriptor (@[Params.x]) y
#                  valor por defecto (@[x:default], sin ':' en el default).
# =============================================================================
Version: 2
Name: "TC_Demo_Variables"
Sequence:
  # --- Valores fijos del motor: no dependen del UE ---
  - Order: 100
    Task: "Run.Message"
    Config:
      Severity: "INFO"
      Message: "[1/5] Valores del motor -> ExecutionId=@{ExecutionId} | Application=@{Application} | TempFolder=@{TempFolder} | JSONParameters=@{JSONParameters}"

  # --- Valores publicados por el fichero UE ---
  - Order: 101
    Task: "Run.Message"
    Config:
      Severity: "INFO"
      Message: "[2/5] Variables del UE -> MonitoringIp=@[MonitoringIp] | SutIp=@[SutIp] | MonitorTime=@[MonitorTime] s | Measurement=@[DatasetMeasurement]"

  # Run.Dummy no tiene parametros fijos: vuelca al log lo que se le pase, asi que
  # sirve como inspector del estado de las variables en un punto concreto.
  - Order: 102
    Task: "Run.Dummy"
    Config:
      Etapa: "inspeccion de variables globales"
      MonitoringIp: "@[MonitoringIp]"
      PrometheusPort: "@[PrometheusPort]"
      InfluxPort: "@[InfluxPort]"
      SutIp: "@[SutIp]"
      SshUser: "@[SshUser]"
      PingTarget: "@[PingTarget]"
      PingCount: "@[PingCount]"

  # --- Derivar una variable nueva a partir de las del UE ---
  # El ':' va FUERA de los corchetes, por eso es seguro. Un ':' DENTRO de
  # @[...] se interpretaria como separador de valor por defecto.
  - Order: 103
    Task: "Run.Publish"
    Config:
      PrometheusEndpoint: "@[MonitoringIp]:@[PrometheusPort]"
      InfluxEndpoint: "@[MonitoringIp]:@[InfluxPort]"
      RunLabel: "@{Application}-@{ExecutionId}"

  # --- Lo derivado ya es visible para cualquier task posterior ---
  # Ojo: la expansion es de UN SOLO PASO. Si un valor publicado contiene a su vez
  # un "@[...]", ese no se vuelve a expandir.
  - Order: 104
    Task: "Run.Message"
    Config:
      Severity: "INFO"
      Message: "[3/5] Derivadas en este TestCase -> Prometheus=@[PrometheusEndpoint] | Influx=@[InfluxEndpoint] | RunLabel=@[RunLabel]"

  # --- Que pasa cuando la variable no existe ---
  - Order: 105
    Task: "Run.Message"
    Config:
      Severity: "WARNING"
      Message: "[4/5] Sin definir -> @[VariableQueNoExiste] | con default -> @[VariableQueNoExiste:valor_por_defecto] | grupo inexistente -> @[Grupo.Clave]"

  # --- Parametros del Experiment Descriptor (bloque "Parameters") ---
  - Order: 106
    Task: "Run.Message"
    Config:
      Severity: "INFO"
      Message: "[5/5] Parametros del descriptor -> @[Params.Iterations:no_definido] (se declaran en el bloque Parameters de mas abajo)"

Standard: True
Distributed: False
Parameters:
  Iterations:
    Type: "Integer"
    Description: "Ejemplo de parametro del experimento; se lee con @[Params.Iterations]"
Dashboard: {}
KPIs: {}
