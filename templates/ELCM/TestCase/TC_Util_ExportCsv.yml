# =============================================================================
# UTILIDAD: exportar a CSV lo capturado en InfluxDB (alternativa MANUAL a
#           dataset.output = ["csv"])
# =============================================================================
# Proposito: dar al experimentador control total sobre la consulta. La
# herramienta ya genera e inyecta un TestCase equivalente cuando se pide
# dataset.output: ["csv"], pero con una query fija. Este fichero es para cuando
# se necesita otra query (otro rango, otro filtro, otra agregacion).
#
# Banda de Order: 820-829 (banda de ENTREGA: se ejecuta despues de todos los
# TestCases funcionales y de la captura). Ver el mapa de bandas en el README.
#
# PRERREQUISITOS:
#   - Un TestCase de captura anterior (banda 10-99) que haya volcado datos a
#     InfluxDB, p. ej. TestCase_prometheus_capture.yml.
#   - Variables del UE: MonitoringIp, InfluxPort, InfluxBucket, DatasetMeasurement.
#
# EL Run.CompressFiles FINAL NO ES OPCIONAL:
#   Run.InfluxToCsv escribe <TempFolder>/csv_query_<IdCsv>.csv pero NO lo
#   registra en GeneratedFiles. Sin la compresion, el CSV no llega a
#   GET /execution/{id}/results y se pierde al limpiar el TempFolder.
#
# Nota sobre Run.InfluxToCsv: Host/Port/Database/User/Password/Token/Org son
# opcionales y caen al config.yml de ELCM si no se indican. La version de
# InfluxDB se detecta sola: CustomQuery admite InfluxQL (v1) o Flux (v2).
# =============================================================================
Version: 2
Name: "TC_Util_ExportCsv"
Sequence:
  - Order: 820
    Task: "Run.InfluxToCsv"
    Config:
      IdCsv: "@{ExecutionId}"
      Host: "@[MonitoringIp]"
      Port: "@[InfluxPort:8086]"
      # Query Flux (InfluxDB v2). Debe ir en UNA SOLA LINEA.
      # El pivot() pone un campo por columna y group() lo deja en una unica tabla,
      # que es lo que produce un CSV plano y legible.
      CustomQuery: 'from(bucket: "@[InfluxBucket:testing]") |> range(start: 0) |> filter(fn: (r) => r["_measurement"] == "@[DatasetMeasurement:OPEN5GS_KPIS]") |> filter(fn: (r) => r["ExecutionId"] == "@{ExecutionId}") |> pivot(rowKey:["_time"], columnKey:["_field"], valueColumn:"_value") |> group()'

  - Order: 821
    Task: "Run.Message"
    Config:
      Severity: "INFO"
      Message: "CSV generado en @{TempFolder}/csv_query_@{ExecutionId}.csv (measurement @[DatasetMeasurement:OPEN5GS_KPIS], bucket @[InfluxBucket:testing])"

  # OBLIGATORIO: registra el CSV en GeneratedFiles para que llegue a /results.
  - Order: 822
    Task: "Run.CompressFiles"
    Config:
      Files:
        - "@{TempFolder}/csv_query_@{ExecutionId}.csv"
      Output: "@{TempFolder}/dataset_manual_@{ExecutionId}.zip"

Standard: True
Distributed: False
Parameters: {}
Dashboard: {}
KPIs: {}
