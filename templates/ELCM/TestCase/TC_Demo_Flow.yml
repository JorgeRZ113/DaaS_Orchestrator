# =============================================================================
# Ensenar como se orquestan tasks dentro de un TestCase y como se
# usan las variables de flujo.
#
# Banda de Order: 120-129. Prerrequisitos: NINGUNO.
# Duracion aproximada: ~15 s.
#
# REGLA IMPORTANTE (verificada en Flow/sequences.py y Flow/parallel.py):
#   Las variables de flujo NO se heredan en flujos anidados. Cada Flow expande
#   los parametros de SUS HIJOS DIRECTOS con su propio flowState:
#     - Flow.Parallel pasa {Branch: n} (empieza en 1)
#     - Flow.Repeat   pasa {Iter0: i, Iter1: i+1}
#     - Flow.Sequence pasa {} (vacio)
#   Por eso un @{Branch} escrito dentro de un Flow.Sequence que cuelga de un
#   Flow.Parallel NO se sustituye y queda literal en el log. Usar @{Branch} solo
#   en hijos DIRECTOS de Flow.Parallel.
#
# =============================================================================
Version: 2
Name: "TC_Demo_Flow"
Sequence:

  - Order: 120
    Task: "Flow.Sequence"
    Children:
      - Task: "Run.Message"
        Config:
          Severity: "INFO"
          Message: "[Sequence] paso 1 de 3"
      - Task: "Run.Delay"
        Config:
          Time: 2
      - Task: "Run.Message"
        Config:
          Severity: "INFO"
          Message: "[Sequence] paso 3 de 3 (han pasado 2 s)"

  - Order: 121
    Task: "Flow.Parallel"
    Children:
      - Task: "Run.Message"
        Config:
          Severity: "INFO"
          Message: "[Parallel] rama @{Branch}: la mas rapida, termina ya"
      - Task: "Run.Delay"
        Config:
          Time: 5
      - Task: "Run.CliExecute"
        Config:
          CWD: "@{TempFolder}"
          Parameters: "sh -c 'sleep 2; echo rama paralela terminada en $(date +%T)'"


  - Order: 122
    Task: "Flow.Repeat"
    Config:
      Times: 3
    Children:
      - Task: "Run.Message"
        Config:
          Severity: "INFO"
          Message: "[Repeat] iteracion @{Iter1} de 3 (indice base 0: @{Iter0})"
      - Task: "Run.Delay"
        Config:
          Time: 1


  # Esta es la forma que tienen todas las capturas :
  # una rama con la task que bloquea hasta ver un milestone y otra rama que
  # espera la ventana de medida y lo anade. Aqui se simula con tasks inocuas
  # para poder ensenarlo sin infraestructura.
  - Order: 123
    Task: "Flow.Parallel"
    Children:
      - Task: "Run.Message"
        Config:
          Severity: "INFO"
          Message: "[Patron captura] rama @{Branch}: aqui iria Run.PrometheusToInflux con Stop: mi_milestone"
      - Task: "Flow.Sequence"
        Children:
          - Task: "Run.Delay"
            Config:
              Time: 3
          - Task: "Run.AddMilestone"
            Config:
              Milestone: "demo_flow_terminado"

Standard: True
Distributed: False
Parameters: {}
Dashboard: {}
KPIs: {}
