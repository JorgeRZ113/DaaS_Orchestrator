dataset:
  name: "TC_Dataset_PrometheusToGrafana"
  measurement: ""       #! lo inyecta el generador con el Measurement de la captura
  interval: "5s"
  metrics: []           #! lo inyecta el generador con las metricas simples de la captura
  kpis: {}
