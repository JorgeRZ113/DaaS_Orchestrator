#@ load("@ytt:data", "data")
---
  #! No necesita TN_init, porque se incluye en la base (base_tnlcm_descriptor.yaml)
  vnet-anothernet:
    type: "vnet"
    name: "anothernet"
    dependencies:
      - "tn_init"
    input:
      one_vnet_gw: #@ data.values.network.gateway
      one_vnet_dns: #@ data.values.network.dns
      one_vnet_netmask: #@ data.values.network.netmask
      one_vnet_first_ip: #@ data.values.network.first_ip
      one_vnet_address_size: #@ data.values.network.address_size
