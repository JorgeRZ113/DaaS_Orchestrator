#@ load("@ytt:data", "data")
---
trial_network:
    #! No necesita TN_init, porque se incluye en la base (tnlcm_descriptor_base.yaml)
    mongodb-v8:
      type: "mongodb"
      name: "v8"
      dependencies:
        - "tn_init"
      input:
        one_mongodb_version: #@ data.values.mongodb.version
        one_mongodb_user: #@ data.values.mongodb.user
        one_mongodb_password: #@ data.values.mongodb.password
        one_mongodb_database: #@ data.values.mongodb.database
        one_mongo_express_user: #@ data.values.mongodb.express_user
        one_mongo_express_password: #@ data.values.mongodb.express_password
