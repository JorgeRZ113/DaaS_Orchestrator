#@ load("@ytt:data", "data")

#@ vnet_n2 = "vnet-n2"
#@ core_entity = "open5gs_vm-core"
#@ gnb_entity = "ueransim-gnb"
#@ us = data.values.ueransim_split

---
trial_network:
  #! No necesita TN_init, porque se incluye en la base (base_tnlcm_descriptor.yaml)
  vnet-n2:
    type: "vnet"
    name: "n2"
    dependencies:
      - "tn_init"
    input:
      one_vnet_first_ip: #@ us.n2_first_ip
      one_vnet_netmask: #@ us.n2_netmask
      one_vnet_address_size: #@ us.n2_address_size
  open5gs_vm-core:
    type: "open5gs_vm"
    name: "core"
    dependencies:
      - "tn_init"
      - #@ vnet_n2
    input:
      one_open5gs_vm_external_vnet: #@ us.open5gs_external_vnet
      one_open5gs_vm_internal_vnet: #@ [vnet_n2]
      one_open5gs_vm_size: #@ us.open5gs_size
      one_open5gs_vm_ue_subnet: #@ us.open5gs_ue_subnet
      one_open5gs_vm_amf_n2_ip: #@ us.open5gs_amf_n2_ip
      one_open5gs_vm_upf_n3_ip: #@ us.open5gs_upf_n3_ip
      one_open5gs_vm_ue_count: #@ us.open5gs_ue_count
      one_open5gs_vm_tac: #@ us.open5gs_tac
      one_open5gs_vm_mcc: #@ us.open5gs_mcc
      one_open5gs_vm_mnc: #@ us.open5gs_mnc
      one_open5gs_vm_msin: #@ us.open5gs_msin
      one_open5gs_vm_key: #@ us.open5gs_key
      one_open5gs_vm_opc: #@ us.open5gs_opc
      one_open5gs_vm_apn: #@ us.open5gs_apn
      one_open5gs_vm_s_nssai_sst: #@ us.open5gs_s_nssai_sst
      one_open5gs_vm_s_nssai_sd: #@ us.open5gs_s_nssai_sd
  ueransim-gnb:
    type: "ueransim"
    name: "gnb"
    dependencies:
      - #@ core_entity
    input:
      one_ueransim_networks: #@ us.gnb_networks
      one_ueransim_mode: "gnb"
      #@ if us.gnb_run_gnb != "":
      one_ueransim_run_gnb: #@ us.gnb_run_gnb
      #@ end
      #@ if us.gnb_run_ue != "":
      one_ueransim_run_ue: #@ us.gnb_run_ue
      #@ end
      one_ueransim_gnb_linked_5gcore: #@ core_entity
      #@ if us.gnb_amf_n2_ip != "":
      one_ueransim_gnb_amf_n2_ip: #@ us.gnb_amf_n2_ip
      #@ end
      #@ if us.gnb_tac != "":
      one_ueransim_gnb_tac: #@ us.gnb_tac
      #@ end
      #@ if us.gnb_mcc != "":
      one_ueransim_gnb_mcc: #@ us.gnb_mcc
      #@ end
      #@ if us.gnb_mnc != "":
      one_ueransim_gnb_mnc: #@ us.gnb_mnc
      #@ end
      #@ if us.gnb_slices_sst != "":
      one_ueransim_gnb_slices_sst: #@ us.gnb_slices_sst
      #@ end
      #@ if us.gnb_slices_sd != "":
      one_ueransim_gnb_slices_sd: #@ us.gnb_slices_sd
      #@ end
  ueransim-ue:
    type: "ueransim"
    name: "ue"
    dependencies:
      - #@ gnb_entity
    input:
      one_ueransim_networks: #@ us.ue_networks
      one_ueransim_mode: "ue"
      #@ if us.ue_run_gnb != "":
      one_ueransim_run_gnb: #@ us.ue_run_gnb
      #@ end
      #@ if us.ue_run_ue != "":
      one_ueransim_run_ue: #@ us.ue_run_ue
      #@ end
      one_ueransim_ue_linked_gnb: #@ gnb_entity
      #@ if us.ue_gnbsearchlist != "":
      one_ueransim_ue_gnbsearchlist: #@ us.ue_gnbsearchlist
      #@ end
      #@ if us.ue_mcc != "":
      one_ueransim_ue_mcc: #@ us.ue_mcc
      #@ end
      #@ if us.ue_mnc != "":
      one_ueransim_ue_mnc: #@ us.ue_mnc
      #@ end
      #@ if us.ue_msin != "":
      one_ueransim_ue_msin: #@ us.ue_msin
      #@ end
      #@ if us.ue_key != "":
      one_ueransim_ue_key: #@ us.ue_key
      #@ end
      #@ if us.ue_opc != "":
      one_ueransim_ue_opc: #@ us.ue_opc
      #@ end
      #@ if us.ue_session_apn != "":
      one_ueransim_ue_session_apn: #@ us.ue_session_apn
      #@ end
      #@ if us.ue_session_sst != "":
      one_ueransim_ue_session_sst: #@ us.ue_session_sst
      #@ end
      #@ if us.ue_session_sd != "":
      one_ueransim_ue_session_sd: #@ us.ue_session_sd
      #@ end
