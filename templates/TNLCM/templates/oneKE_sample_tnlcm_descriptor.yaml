#@ load("@ytt:data", "data")
---
trial_network:
    #! No necesita TN_init, porque se incluye en la base (tnlcm_descriptor_base.yaml)
    vnet-internal:
      type: "vnet"
      name: "internal"
      dependencies:
        - "tn_init"
      input:
        one_vnet_first_ip: "10.21.12.1"     #! Default value
        #! one_vnet_netmask: 24              #! Default value
        #! one_vnet_address_size: 100        #! Default value
    oneKE-cluster:
      type: "oneKE"
      name: "cluster"
      dependencies:
        - "tn_init"
        - "vnet-internal"
      input:
        one_oneKE_external_vnet: #@ data.values.oneKE.external_vnet
        one_oneKE_internal_vnet: #@ data.values.oneKE.internal_vnet
        one_oneKE_worker_nodes: #@ data.values.oneKE.worker_nodes
        one_oneKE_version: #@ data.values.oneKE.version
        #! one_oneKE_multus: true             #! Default value
        #! one_oneKE_cni_plugin: "canal"      #! Default value
        #! one_oneKE_metallb: true            #! Default value
        one_oneKE_metallb_range: #@ data.values.oneKE.metallb_range
        #! one_oneKE_longhorn: true           #! Default value
        #! one_oneKE_traefik: false           #! Default value
        #! one_oneKE_nginx_passthough: false  #! Default value
