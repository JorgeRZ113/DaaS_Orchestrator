#@ load("@ytt:data", "data")

#@ vnet_n2 = "vnet-n2"
#@ vnet_n3 = "vnet-n3"
#@ n3_enabled = data.values.open5gs_vm.n3_first_ip != ""
#@ internal_vnets = [vnet_n2, vnet_n3] if n3_enabled else [vnet_n2]

---
trial_network:
    #! No necesita TN_init, porque se incluye en la base (base_tnlcm_descriptor.yaml)
    vnet-n2:
      type: "vnet"
      name: "n2"
      dependencies:
        - "tn_init"
      input:
        one_vnet_first_ip: #@ data.values.open5gs_vm.n2_first_ip
        one_vnet_netmask: #@ data.values.open5gs_vm.n2_netmask
        one_vnet_address_size: #@ data.values.open5gs_vm.n2_address_size
    #@ if n3_enabled:
    vnet-n3:
      type: "vnet"
      name: "n3"
      dependencies:
        - "tn_init"
      input:
        one_vnet_first_ip: #@ data.values.open5gs_vm.n3_first_ip
        one_vnet_netmask: #@ data.values.open5gs_vm.n3_netmask
        one_vnet_address_size: #@ data.values.open5gs_vm.n3_address_size
    #@ end
    open5gs_vm-core:
      type: "open5gs_vm"
      name: "core"
      dependencies: #@ ["tn_init"] + internal_vnets
      input:
        one_open5gs_vm_external_vnet: #@ data.values.open5gs_vm.external_vnet
        one_open5gs_vm_internal_vnet: #@ internal_vnets
        one_open5gs_vm_size: #@ data.values.open5gs_vm.size
        one_open5gs_vm_ue_subnet: #@ data.values.open5gs_vm.ue_subnet
        one_open5gs_vm_amf_n2_ip: #@ data.values.open5gs_vm.amf_n2_ip
        one_open5gs_vm_upf_n3_ip: #@ data.values.open5gs_vm.upf_n3_ip
        one_open5gs_vm_ue_count: #@ data.values.open5gs_vm.ue_count
        one_open5gs_vm_tac: #@ data.values.open5gs_vm.tac
        one_open5gs_vm_mcc: #@ data.values.open5gs_vm.mcc
        one_open5gs_vm_mnc: #@ data.values.open5gs_vm.mnc
        one_open5gs_vm_msin: #@ data.values.open5gs_vm.msin
        one_open5gs_vm_key: #@ data.values.open5gs_vm.key
        one_open5gs_vm_opc: #@ data.values.open5gs_vm.opc
        one_open5gs_vm_apn: #@ data.values.open5gs_vm.apn
        one_open5gs_vm_s_nssai_sst: #@ data.values.open5gs_vm.s_nssai_sst
        one_open5gs_vm_s_nssai_sd: #@ data.values.open5gs_vm.s_nssai_sd
        one_open5gs_vm_use_nightly: #@ data.values.open5gs_vm.use_nightly
        one_open5gs_vm_install_webui: #@ data.values.open5gs_vm.install_webui
        one_open5gs_vm_loglevel: #@ data.values.open5gs_vm.loglevel
