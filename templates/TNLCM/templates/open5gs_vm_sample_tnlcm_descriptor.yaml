#@ load("@ytt:data", "data")
---
trial_network:
    #! No necesita TN_init, porque se incluye en la base (base_tnlcm_descriptor.yaml)
    vnet-n2:
      type: "vnet"
      name: "n2"
      dependencies: 
        - "tn_init"
      input:
        one_vnet_first_ip: #@ data.values.network.n2_first_ip
        one_vnet_netmask: #@ data.values.network.n2_netmask
        one_vnet_address_size: #@ data.values.network.n2_address_size
    #! vnet-n3:
    #!   type: "vnet"
    #!   name: "n3"
    #!   dependencies:
    #!     - "tn_init"
    #!   input:
    #!     one_vnet_first_ip: "10.10.11.1"
    #!     one_vnet_netmask: 24
    #!     one_vnet_address_size: 254
    #!     one_vnet_gw: null  #! there is no gateway in this network
    #!     one_vnet_dns: null #! there is no DNS in this network
    open5gs_vm-core:
      type: "open5gs_vm"
      name: "core"
      dependencies:
        - "tn_init"
        - "vnet-n2"
      input:
        one_open5gs_vm_external_vnet: #@ data.values.open5gs.external_vnet
        one_open5gs_vm_internal_vnet: #@ data.values.open5gs.internal_vnet
        one_open5gs_vm_size: #@ data.values.open5gs.vm_size
        one_open5gs_vm_install_webui: #@ data.values.open5gs.install_webui
        one_open5gs_vm_loglevel: #@ data.values.open5gs.loglevel
